name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Not secrets. The publishable key is designed to ship in the client
      # bundle; row-level security is what protects the data, and the build
      # fails via scripts/check-build.mjs if a real secret ever lands in dist/.
      VITE_SUPABASE_URL: https://iqjerqtcquvchvbseveh.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cVZZYT50WyOKMvaM2kUhwg_asbib261
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Parser, route normalisation and insights, asserted against the real
      # export. A regression here should stop the deploy, not reach the phone.
      - run: npm run verify

      # Also runs scripts/check-build.mjs, which fails on a leaked secret.
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
