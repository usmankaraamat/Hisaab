name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Not secrets. The publishable key is designed to ship in the client
      # bundle; row-level security is what protects the data, and the build
      # fails via scripts/check-build.mjs if a real secret ever lands in dist/.
      VITE_SUPABASE_URL: https://iqjerqtcquvchvbseveh.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cVZZYT50WyOKMvaM2kUhwg_asbib261
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Parser, route normalisation and insights, asserted against the real
      # export. A regression here should stop the deploy, not reach the phone.
      - run: npm run verify

      # Also runs scripts/check-build.mjs, which fails on a leaked secret.
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Migrations and edge functions ship from the same commit as the site. Both
  # used to be applied by hand, and a table and a function version drifted
  # from the repo unnoticed. Runs after verify, before the site goes live, so
  # the client never lands ahead of the schema it needs.
  backend:
    needs: build
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: iqjerqtcquvchvbseveh
    steps:
      - name: Check Supabase secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD is not set; migrations and functions were NOT deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - if: steps.secrets.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF"

      # Applies only migrations not yet in the remote history; a no-op otherwise.
      - if: steps.secrets.outputs.ready == 'true'
        run: supabase db push

      # Per-function verify_jwt comes from supabase/config.toml.
      - if: steps.secrets.outputs.ready == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF"

  deploy:
    needs: [build, backend]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
